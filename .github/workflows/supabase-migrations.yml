name: supabase-migrations

on:
  pull_request:

concurrency:
  group: supabase-migrations-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  migration-check:
    name: Supabase migratiecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch basisbranch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Migraties vergelijken
        id: check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          SUPABASE_DB_URL_READONLY: ${{ secrets.SUPABASE_DB_URL_READONLY }}
        run: |
          node scripts/ci/supabase-migration-check.mjs | tee migration-report.md
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          cat migration-report.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Sticky PR-comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: supabase-migration-check
          path: migration-report.md